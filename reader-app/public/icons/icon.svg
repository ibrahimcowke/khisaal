<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241B12" />
      <stop offset="50%" stop-color="#18120C" />
      <stop offset="100%" stop-color="#0E0A07" />
    </linearGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2C6" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#C29B38" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#8F6B1E" />
    </linearGradient>

    <linearGradient id="goldTrim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7624" />
      <stop offset="30%" stop-color="#F3D580" />
      <stop offset="70%" stop-color="#DCAE3F" />
      <stop offset="100%" stop-color="#845E16" />
    </linearGradient>

    <linearGradient id="parchmentLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFD0B2" />
      <stop offset="60%" stop-color="#FBF7EC" />
      <stop offset="100%" stop-color="#ECE2CD" />
    </linearGradient>

    <linearGradient id="parchmentRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECE2CD" />
      <stop offset="40%" stop-color="#FAF5EA" />
      <stop offset="100%" stop-color="#DFD0B2" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#836A42" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#goldTrim)" stroke-width="4" filter="url(#cardShadow)" />

  <!-- Inner Subtle Filigree Ring -->
  <rect x="32" y="32" width="448" height="448" rx="98" fill="none" stroke="url(#goldLuster)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6,4" />

  <!-- Center Radial Warm Glow -->
  <circle cx="256" cy="245" r="190" fill="url(#centerGlow)" />

  <!-- Corner Arabesque Ornaments -->
  <!-- Top-Left -->
  <path d="M 64 88 C 76 88, 88 76, 88 64 M 64 100 C 84 100, 100 84, 100 64" fill="none" stroke="url(#goldLuster)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="76" cy="76" r="3" fill="#F3D580" />

  <!-- Top-Right -->
  <path d="M 448 88 C 436 88, 424 76, 424 64 M 448 100 C 428 100, 412 84, 412 64" fill="none" stroke="url(#goldLuster)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="436" cy="76" r="3" fill="#F3D580" />

  <!-- Bottom-Left -->
  <path d="M 64 424 C 76 424, 88 436, 88 448 M 64 412 C 84 412, 100 428, 100 448" fill="none" stroke="url(#goldLuster)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="76" cy="436" r="3" fill="#F3D580" />

  <!-- Bottom-Right -->
  <path d="M 448 424 C 436 424, 424 436, 424 448 M 448 412 C 428 412, 412 428, 412 448" fill="none" stroke="url(#goldLuster)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <circle cx="436" cy="436" r="3" fill="#F3D580" />

  <!-- Top Crest: 8-Pointed Star of Wisdom (نجمة الأندلس الثمانية) -->
  <g transform="translate(256, 110) scale(0.9)" filter="url(#softGlow)">
    <!-- Square 1 -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldLuster)" stroke="#845E16" stroke-width="1.5" />
    <!-- Square 2 (Rotated 45deg) -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="url(#goldLuster)" stroke="#845E16" stroke-width="1.5" transform="rotate(45)" />
    <!-- Inner Core -->
    <circle cx="0" cy="0" r="10" fill="#1C1610" />
    <circle cx="0" cy="0" r="5" fill="#FFF2C6" />
    <!-- Radiating Light Rays -->
    <line x1="0" y1="-38" x2="0" y2="-28" stroke="#FFE79A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="28" x2="0" y2="38" stroke="#FFE79A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-38" y1="0" x2="-28" y2="0" stroke="#FFE79A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="0" x2="38" y2="0" stroke="#FFE79A" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Open Manuscript Book Body -->
  <g transform="translate(0, 20)">
    <!-- Book Spine / Outer Binding Base -->
    <path d="M 256 360 L 256 374 C 210 355 140 354 86 376 L 86 360 C 140 338 210 340 256 360 Z" fill="#845E16" opacity="0.9" />
    <path d="M 256 360 L 256 374 C 302 355 372 354 426 376 L 426 360 C 372 338 302 340 256 360 Z" fill="#6E4D0F" opacity="0.9" />

    <!-- Left Underlay Pages -->
    <path d="M 256 348 C 210 330 144 330 94 350 L 92 208 C 144 190 210 190 256 206 Z" fill="#D3C3A1" />
    <path d="M 256 342 C 210 324 146 324 98 344 L 96 202 C 146 184 210 184 256 200 Z" fill="#E8DBBF" />

    <!-- Right Underlay Pages -->
    <path d="M 256 348 C 302 330 368 330 418 350 L 420 208 C 368 190 302 190 256 206 Z" fill="#D3C3A1" />
    <path d="M 256 342 C 302 324 366 324 414 344 L 416 202 C 366 184 302 184 256 200 Z" fill="#E8DBBF" />

    <!-- Main Left Page -->
    <path d="M 256 336 C 206 316 142 316 102 336 L 102 192 C 142 174 206 174 256 192 Z" fill="url(#parchmentLeft)" stroke="url(#goldTrim)" stroke-width="2" />

    <!-- Main Right Page -->
    <path d="M 256 336 C 306 316 370 316 410 336 L 410 192 C 370 174 306 174 256 192 Z" fill="url(#parchmentRight)" stroke="url(#goldTrim)" stroke-width="2" />

    <!-- Center Book Spine Crease & Gold Ribbon -->
    <path d="M 256 190 L 256 338" stroke="#A88746" stroke-width="3" stroke-linecap="round" />

    <!-- Left Page Subtle Calligraphy / Lines -->
    <path d="M 132 216 C 165 210 198 210 230 216" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 132 238 C 165 232 198 232 230 238" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 132 260 C 165 254 198 254 230 260" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 150 282 C 175 277 205 277 230 282" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- Right Page Subtle Calligraphy / Lines -->
    <path d="M 282 216 C 314 210 347 210 380 216" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 282 238 C 314 232 347 232 380 238" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 282 260 C 314 254 347 254 380 260" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 282 282 C 307 277 337 277 362 282" stroke="#9E8D6B" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />

    <!-- Central Floating Golden Calligraphic Motif "إ & خ" -->
    <g transform="translate(256, 252)" filter="url(#softGlow)">
      <!-- Golden Diamond Emblem -->
      <polygon points="0,-22 18,0 0,22 -18,0" fill="url(#goldLuster)" stroke="#845E16" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4.5" fill="#1C1610" />
      <circle cx="0" cy="0" r="2" fill="#FFF2C6" />
    </g>

    <!-- Silk Bookmark Ribbon Hanging Down -->
    <path d="M 253 336 L 253 398 L 256 392 L 259 398 L 259 336 Z" fill="url(#goldLuster)" stroke="#845E16" stroke-width="1" />
  </g>

  <!-- Bottom Arch Laurel Wreath / Wings of Wisdom -->
  <g transform="translate(256, 420)" opacity="0.85">
    <path d="M -90 -8 C -50 16, 0 20, 0 20 C 0 20, 50 16, 90 -8" fill="none" stroke="url(#goldLuster)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-90" cy="-8" r="3.5" fill="#FFEAA5" />
    <circle cx="90" cy="-8" r="3.5" fill="#FFEAA5" />
    <circle cx="0" cy="20" r="4" fill="#FFEAA5" />
  </g>
</svg>
